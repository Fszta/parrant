[project]
name = "parrant"
version = "0.21.0"
description = "Parrant — the offline pre-merge column-impact gate for dbt: parry the breaking changes, warrant the safe ones"
authors = [
    {name = "Fszta"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.6,<3.0.0",
    "sqlglot (>=26.8.0,<27.0.0)",
    "click (>=8.1.0,<9.0.0)",
    "graphviz (>=0.20.3,<0.21.0)",
    "fastapi (>=0.116.0,<1.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "requests (>=2.32.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry.scripts]
parrant = "parrant.cli.main:main"
# Compatibility alias (removed in a future major): warns to stderr, then delegates to `parrant`.
dbt-col-lineage = "parrant.cli.main:main_legacy"
test = "scripts.run_tests:run_tests"
test-unit = "scripts.run_tests:run_tests_unit"
test-integration = "scripts.run_tests:run_tests_integration"
test-e2e = "scripts.run_tests:run_tests_e2e"
format = "scripts.format:format_code"
type-check = "scripts.type_check:type_check"

[tool.poetry.group.dev.dependencies]
# dbt-duckdb (which pulls in dbt-core) and duckdb are only needed to generate the
# test project's manifest.json / catalog.json artifacts. The tool itself only reads
# those artifacts, so they are dev-only and not runtime dependencies.
dbt-duckdb = ">=1.9.2,<2.0.0"
# Cap dbt-core below the 2.0 (Fusion) line: it's dev-only (regenerates the test
# project's artifacts) and 2.0's stricter config validation rejects the fixtures.
# Also stops poetry from resolving to a 2.0.0bN prerelease.
dbt-core = ">=1.9.0,<2.0.0"
duckdb = ">=1.2.1,<2.0.0"
pytest = ">=8.3.4,<10.0.0"
mypy = ">=1.15.0,<2.0.0"
black = ">=24.10.0"
ruff = ">=0.8.4"
mkdocs-material = ">=9.5.0,<10.0.0"
mkdocs-click = ">=0.8.1,<0.9.0"
requests = ">=2.32.0,<3.0.0"
types-requests = ">=2.32.0,<3.0.0"
types-pyyaml = "^6.0.12.20260815"
httpx = ">=0.27.0,<1.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail tests on any deprecation (e.g. starlette's old TemplateResponse convention, removed
# in 1.6 — issue #139), instead of warning silently until the upstream removal ships to end
# users. If a third-party-internal deprecation we can't fix starts breaking CI, add a scoped
# "ignore:<message>::<module>" entry below the error rules rather than loosening them.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
files = ["dbt_column_lineage", "tests"]
show_error_codes = true
pretty = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "sqlglot.*",
    "dbt.*",
    "duckdb.*",
    "pytest.*",
    "requests.*",
    "pydantic.*",
    "fastapi.*",
    "uvicorn.*",
    "click.*"
]
ignore_missing_imports = true

[tool.poetry]
name = "parrant"
packages = [
    {include = "parrant"}
]
license = "MIT"
