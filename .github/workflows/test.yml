name: Test

on:
  push:
    branches: [ main ]
    paths:
      - 'parrant/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'parrant/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: the `policy test` e2e replays a git range (HEAD~N..HEAD),
        # which a shallow (depth-1) checkout cannot walk.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        # Pin Poetry: "latest" (2.4.1) fails to install on the runners, and the
        # project targets Poetry 2.x (poetry-core>=2.0.0; lockfile generated by 2.1.3).
        version: 2.1.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Type check
      run: poetry run type-check

    - name: Check formatting (black)
      run: poetry run black --check --line-length=100 .

    - name: Lint (ruff)
      run: poetry run ruff check .

    - name: Run unit tests
      run: poetry run test-unit

    - name: Run integration tests
      run: poetry run test-integration

    - name: Run e2e
      run: poetry run test-e2e
